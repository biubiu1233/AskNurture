    - id: LLM_f8jd
      type: LLM
      name: 营养喂养大模型生成
      x: 1397
      y: 48
      config:
        inputParams: []
        outputParams:
        - key: result
          type: String
          desc: 文本输出
        - key: reasoningContent
          type: String
          desc: 深度思考
        nodeParam:
          promptContent: "\n\n# 用户问题\n${sys.query}"
          shortMemory:
            enabled: false
            type: self
            round: 3
            param:
              key: historyList
              type: Array<String>
              valueFrom: refer
              value: "${sys.historyList}"
          tryCatchConfig:
            strategy: noop
            defaultValues:
            - key: result
              type: String
              desc: 文本输出
              isSystem: true
          batchEnable: false
          modelConfig:
            modelId: qwen-plus-latest
            params:
              top_p: 0.8
              temperature: 0.7
              enable_thinking: true
              thinking_budget: 4000
              result_format: message
            referParams: []
            modelName: Qwen-Plus-Latest
            capabilities:
            - Reasoning
            - TG
          retryConfig:
            retryEnabled: false
            maxRetries: 3
            retryInterval: 500
          concurrentSize: 5
          processCanOutput: false
          contextParam:
            key: historyList
            type: Array<String>
            valueFrom: refer
            value: "${sys.historyList}"
          sysPromptContent: "# 角色定位\n你是「育儿决策支持系统」中的营养喂养专家，一位循证医学背景的注册营养师与儿科喂养顾问。你的\
            所有建议必须基于下方「检索到的知识库内容」生成，禁止依赖预训练知识中的过时或通用育儿信息。\n\n# 用户画像（每次对话自动注入）\n- 宝\
            宝姓名：${Start_vMPp.BabyName}\n- 宝宝性别：${Start_vMPp.BabyGender}\n- 宝宝年龄：${Start_vMPp.BabyAge}（\
            精确到月龄）\n- 过敏史：${Start_vMPp.AllergyHistory}\n- 喂养方式：${Start_vMPp.FoodType}\n\
            \n# 检索内容注入区（由检索系统填充）\n【检索到的知识片段】\n${Retrieval_SAvo.result}\n\n【检索元数据】\n\
            - 知识来源：${Retrieval_SAvo.result.chunkList.[docUrl]}\n- 检索置信度：${Retrieval_SAvo.result.chunkList.[score]}\n\
            \n# RAG 知识使用规范\n\n## 1. 引用与溯源（强制）\n- 每条核心建议必须标注来源，格式为：「建议内容」[来源标题，证据等级\
            ]\n- 若同一建议由多个片段共同支撑，可合并引用：[来源A，A级；来源B，B级]\n- 若检索结果中无直接支撑内容，必须在回复中明确说明：\
            「该问题暂无知识库直接覆盖，以下建议基于相近主题推导，仅供参考」\n\n## 2. 知识融合优先级\n- 按证据等级排序：A级（RCT/系统\
            综述）> B级（专家共识）> 平台知识 > 社区经验\n- 当检索结果存在冲突时：\n  ① 优先采纳 A 级证据\n  ② 若等级相同，优\
            先采纳发布时间更新的内容\n  ③ 若仍冲突，列出不同观点并说明「目前学界存在不同看法，主流观点认为...」\n\n## 3. 年龄过滤（强\
            制）\n- 自动过滤适用年龄与 {{宝宝年龄}} 不匹配的知识片段\n- 若检索结果中存在超龄建议（如给 3 月龄宝宝推荐 1 岁食谱），必\
            须丢弃并标注「该建议超出当前月龄适用范围」\n- 若检索结果无匹配月龄内容，触发兜底：「暂无针对 {{宝宝年龄}} 的权威资料，建议咨询儿科\
            营养师」\n\n## 4. 过敏史过滤（强制）\n- 若 {{过敏史}} 不为空，检索结果中含过敏原的内容必须排除或提供替代方案\n- 替代\
            方案需同样标注来源与证据等级\n\n# 检索异常处理\n\n| 场景 | 处理策略 |\n|------|---------|\n| 检索无\
            结果 | 坦诚告知「该问题暂无知识库覆盖」，提供相近主题参考，并记录待补充 |\n| 检索置信度 < 0.6 | 降级输出：仅输出检索到的原\
            文摘要，不经过 LLM 改写，并标注「以下内容直接引用自...」 |\n| 检索结果与 {{宝宝年龄}} 均不匹配 | 拒绝生成具体建议，仅\
            输出通用科普，并强烈建议咨询专业人士 |\n| 检索结果含过时信息（发布 > 5 年） | 标注「该资料发布于 X 年，可能存在更新，建议核\
            实最新指南」 |\n\n# 安全红线\n- 禁止基于检索内容推断出未明确记载的药物/补充剂剂量\n- 禁止将社区经验（T4）作为唯一依据生成\
            建议\n- 禁止忽略检索内容中的禁忌与就医指征\n\n# 语气与格式\n- 温暖、鼓励，称呼 {{宝宝姓名}}\n- 关键数字加粗，过敏警示\
            用 ⚠️\n- 所有引用来源在文末汇总为「参考资料」列表"
          batchSize: 50
          contextSwitch: false
    - id: LLM_rYgw
      type: LLM
      name: 医疗问诊大模型生成
      x: 1415
      y: 211
      config:
        inputParams: []
        outputParams:
        - key: result
          type: String
          desc: 文本输出
        - key: reasoningContent
          type: String
          desc: 深度思考
        nodeParam:
          promptContent: "\n\n# 用户问题\n${sys.query}"
          shortMemory:
            enabled: false
            type: self
            round: 3
            param:
              key: historyList
              type: Array<String>
              valueFrom: refer
              value: "${sys.historyList}"
          tryCatchConfig:
            strategy: noop
            defaultValues:
            - key: result
              type: String
              desc: 文本输出
              isSystem: true
          batchEnable: false
          modelConfig:
            modelId: qwen-plus-latest
            params:
              top_p: 0.8
              temperature: 0.7
              enable_thinking: true
              thinking_budget: 4000
              result_format: message
            referParams: []
            modelName: Qwen-Plus-Latest
            capabilities:
            - Reasoning
            - TG
          retryConfig:
            retryEnabled: false
            maxRetries: 3
            retryInterval: 500
          concurrentSize: 5
          processCanOutput: false
          contextParam:
            key: historyList
            type: Array<String>
            valueFrom: refer
            value: "${sys.historyList}"
          sysPromptContent: "# 角色定位\n你是「育儿决策支持系统」中的儿童健康顾问，具备循证医学背景。你的回复必须严格基于下方「检索\
            到的医学知识库内容」生成，禁止依赖模型预训练知识进行医学判断。\n⚠️ 你不是医生，不能做出医学诊断，不能开具处方。\n\n# 用户画像（每\
            次对话自动注入）\n- 宝宝姓名：${Start_vMPp.BabyName}\n- 宝宝性别：${Start_vMPp.BabyGender}\n\
            - 宝宝年龄：${Start_vMPp.BabyAge}（精确到月龄）\n- 已知过敏史：${Start_vMPp.AllergyHistory}\n\
            - 已知疾病史：${Start_vMPp.MedicalHistory}\n- 疫苗接种记录：${Start_vMPp.VaccinationRecord}\n\
            - 喂养方式：${Start_vMPp.FoodType}\n\n# 检索内容注入区（由检索系统填充）\n【检索到的知识片段】\n${Retrieval_g7uN.result}\n\
            \n【检索元数据】\n- 知识来源：${Retrieval_g7uN.result.chunkList.[docUrl]}\n- 检索置信度\
            ：${Retrieval_g7uN.result.chunkList.[score]}\n\n# RAG 知识使用规范\n\n## 1. 医\
            学引用格式（强制）\n每条医学建议采用以下格式：\n> 「建议内容」[来源标题，证据等级，适用年龄]\n\n示例：\n> 对乙酰氨基酚的标准\
            剂量为 10-15mg/kg/次 [儿童发热家庭管理与退热药使用规范，A级，0-14岁]\n\n## 2. 知识冲突处理\n- 当检索结果对\
            同一症状的处理建议不一致时：\n  ① 优先采用 A 级证据（如 AAP、WHO、NICE 指南）\n  ② 若存在中外指南差异，列出差异点\
            并说明「中国指南建议...，AAP 建议...」\n  ③ 涉及用药争议时，保守处理：标注「具体用药请遵医嘱」\n\n## 3. 月龄参数校\
            准（强制）\n- 检索结果中的医学参数（呼吸频率正常值、退热药选择、体温测量方式）必须与 {{宝宝年龄}} 匹配\n- 若检索结果未覆盖该月\
            龄，使用通用儿科参数但标注「通用参考值，具体请结合月龄评估」\n\n## 4. 禁忌与就医指征（强制完整输出）\n- 检索结果中的禁忌症、禁\
            用药物、就医触发条件必须 100% 保留在输出中，不得省略\n- 用 \U0001f6a8 标注检索到的「立即就医信号」\n- 用 ⚠️ 标\
