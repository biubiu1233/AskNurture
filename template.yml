            type: String
            desc: 思考过程
          - key: subject
            type: String
            desc: 命中主题
        nodeParam:
          shortMemory:
            enabled: true
            type: custom
            round: 3
            param:
              key: historyList
              type: Array<String>
              valueFrom: refer
              value: "${sys.historyList}"
          multiDecision: false
          modelConfig:
            modelId: tongyi-intent-detect-v3
            params:
              top_p: 0.8
              temperature: 0.7
            modelName: 意图分类模型
            capabilities:
            - TG
            referParams: []
          instruction: ""
          contextParam:
            key: historyList
            type: Array<String>
            valueFrom: refer
            value: "${sys.historyList}"
          modeSwitch: efficient
          conditions:
          - conditionId: default
            subject: ""
            targetIds:
            - VariableHandle_ifit
          - conditionId: TCCz
            subject: 婴幼儿的营养喂养咨询
            targetIds:
